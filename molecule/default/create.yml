---
- name: Create Incus VM
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Write cloud-init user-data
      ansible.builtin.copy:
        content: |
          #cloud-config
          users:
            - name: ubuntu
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - {{ lookup('file', '~/.ssh/work.pub') }}
          # Le pont Incus ne route pas l IPv6 sortant, et les miroirs Ubuntu se
          # resolvent d abord en IPv6 : apt n atteindrait rien. IPv4 force.
          write_files:
            - path: /etc/apt/apt.conf.d/99force-ipv4
              content: 'Acquire::ForceIPv4 "true";'
          package_update: true
          packages:
            - openssh-server
          runcmd:
            - systemctl enable ssh
        dest: /tmp/secured-server-user-data.yaml

    - name: Create VM with cloud-init config
      ansible.builtin.shell:
        cmd: >
          incus launch images:ubuntu/24.04/cloud secured-server
          --config user.user-data="$(cat /tmp/secured-server-user-data.yaml)"
      register: incus_create
      changed_when: incus_create.rc == 0

    - name: Wait for VM to start
      ansible.builtin.command:
        cmd: incus exec secured-server -- cloud-init status --wait
      retries: 15
      delay: 5
      register: result
      until: result.rc == 0

    - name: Get IPv6 address
      ansible.builtin.command:
        cmd: incus list secured-server -f json
      register: incus_list

    - name: Set IPv6 fact
      ansible.builtin.set_fact:
        instance_ipv6: "{{ incus_list.stdout | from_json | json_query('[0].state.network.eth0.addresses[?family==`inet6` && scope==`global`].address | [0]') }}"

    - name: Write instance config
      ansible.builtin.copy:
        content: |
          - address: {{ instance_ipv6 }}
            identity_file: ~/.ssh/work
            instance: secured-server
            port: 22
            user: ubuntu
        dest: "{{ molecule_instance_config }}"