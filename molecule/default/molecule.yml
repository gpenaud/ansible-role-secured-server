driver:
  name: default

platforms:
  - name: secured-server
    source:
      alias: ubuntu/24.04
    type: container
    profiles:
      - default

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  config_options:
    defaults:
      interpreter_python: auto_silent
  connection_options:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

verifier:
  name: ansible