---
# pam_pwquality pour les mots de passe qui se tapent encore : celui de sudo.

- name: "Mots de passe - libpam-pwquality"
  become: true
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: "Mots de passe - Politique"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-password
    regexp: '^password\s+requisite\s+pam_pwquality\.so'
    line: >-
      password        requisite                       pam_pwquality.so retry=3
      minlen={{ secure_server_password_policy.minlen }}
      minclass={{ secure_server_password_policy.minclass }}
      maxrepeat={{ secure_server_password_policy.maxrepeat }}
      difok={{ secure_server_password_policy.difok }}
      {{ 'gecoscheck' if secure_server_password_policy.gecoscheck else '' }}
