---
# Un seul appel apt par intention : une liste, pas une boucle qui relance apt
# par paquet.

- name: "Paquets - Mise a niveau complete"
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    autoremove: true
  when: secure_server_upgrade_packages | bool

- name: "Paquets - Outils de base"
  become: true
  ansible.builtin.apt:
    name: "{{ secure_server_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
