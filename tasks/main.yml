---
# gpenaud.secured-server : une machine Debian ou Ubuntu fermee, a jour,
# surveillee. Chaque fichier fait une chose ; l ordre compte : les comptes avant
# SSH (le groupe autorise doit exister avant que sshd ne l exige), SSH avant le
# pare-feu (la regle 22 doit etre la avant d activer ufw).
#
# Tout est importe statiquement : les etiquettes (--tags ssh, firewall…) sont
# visibles d un coup d oeil ici et valent pour toutes les taches du fichier.

- name: "Faits - Distribution (le seul sous-ensemble dont le role a besoin)"
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", distribution]
  tags: always

- name: "Faits - Debian ou Ubuntu, rien d autre"
  ansible.builtin.assert:
    that: ansible_os_family == "Debian"
    fail_msg: "secured-server: unsupported OS family {{ ansible_os_family }} (Debian/Ubuntu only)"
  tags: always

- name: "Paquets"
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: "Comptes"
  ansible.builtin.import_tasks: accounts.yml
  tags: [accounts, user, system]

- name: "SSH"
  ansible.builtin.import_tasks: ssh.yml
  tags: [ssh]

- name: "Heure"
  ansible.builtin.import_tasks: time.yml
  tags: [time, ntp, system]

- name: "Mises a jour automatiques"
  ansible.builtin.import_tasks: updates.yml
  tags: [updates, unattended_upgrade, system]

- name: "Qualite des mots de passe"
  ansible.builtin.import_tasks: password-quality.yml
  tags: [password_quality, system]

- name: "Pare-feu"
  ansible.builtin.import_tasks: firewall.yml
  tags: [firewall, network]

- name: "CrowdSec"
  ansible.builtin.import_tasks: crowdsec.yml
  tags: [crowdsec, intrusion, network]

- name: "Audit"
  ansible.builtin.import_tasks: auditing.yml
  tags: [auditing, aide, lynis, rkhunter, clamav, logwatch]

- name: "Courrier sortant"
  ansible.builtin.import_tasks: mail.yml
  tags: [mail]

- name: "Nettoyage"
  ansible.builtin.import_tasks: cleanup.yml
  tags: [cleanup]
