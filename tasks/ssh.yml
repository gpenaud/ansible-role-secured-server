---
# sshd : cles seules, groupe autorise, chiffrement moderne. Le fichier est
# ecrit entier et VALIDE par sshd -t avant d etre pose : une faute de frappe ne
# ferme pas la porte derriere nous. Pas d Include de sshd_config.d : cloud-init y
# ecrit « PasswordAuthentication yes », et la premiere valeur lue l emporte.

- name: "SSH - Configuration"
  become: true
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: "SSH - Retirer les moduli Diffie-Hellman courts"
  become: true
  ansible.builtin.shell:
    # L ancienne version lancait awk sans rediriger : le fichier n etait jamais
    # modifie. Ici le resultat remplace le fichier, et le marqueur evite de
    # recommencer a chaque passage.
    cmd: |
      set -e
      awk '$5 >= 3071' /etc/ssh/moduli > /etc/ssh/moduli.secured && mv /etc/ssh/moduli.secured /etc/ssh/moduli
      touch /etc/ssh/.moduli-secured
    creates: /etc/ssh/.moduli-secured
  notify: Restart ssh
