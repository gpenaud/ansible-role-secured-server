---
# Le compte de service, sa cle, et les deux groupes qui ouvrent SSH et sudo.
#
# Les groupes ont des membres EXACTS, poses par gpasswd -M : un compte retire
# de la liste perd le droit au passage suivant. L ancienne methode supprimait et
# recreait le groupe, ce qui changeait son GID et laissait sshd sans groupe
# autorise pendant un instant.

- name: "Comptes - Groupe du compte de service"
  become: true
  ansible.builtin.group:
    name: "{{ secure_server_group }}"
    state: present

- name: "Comptes - Compte de service"
  become: true
  ansible.builtin.user:
    name: "{{ secure_server_user }}"
    group: "{{ secure_server_group }}"
    shell: /bin/bash
    # Sel derive du nom de la machine : le meme mot de passe donne le meme
    # condense d un passage a l autre (idempotent), et un condense different par
    # machine. L ancien sel fixe « camembert » rendait les condenses comparables.
    password: "{{ secure_server_user_password | password_hash('sha512', (inventory_hostname | hash('sha256'))[:16]) }}"
    state: present

- name: "Comptes - La cle d Ansible, et rien d autre sur le compte de service"
  become: true
  ansible.posix.authorized_key:
    user: "{{ secure_server_user }}"
    key: "{{ secure_server_ssh_key }}"
    exclusive: true
    state: present

- name: "Comptes - Groupes sshusers et sudousers"
  become: true
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: [sshusers, sudousers]

- name: "Comptes - Membres actuels des groupes"
  ansible.builtin.getent:
    database: group
    split: ":"

- name: "Comptes - Membres exacts de sshusers et sudousers"
  become: true
  ansible.builtin.command:
    cmd: gpasswd -M "{{ item.members | join(',') }}" "{{ item.group }}"
  loop:
    - { group: sshusers, members: "{{ secure_server_ssh_allowed_users }}" }
    - { group: sudousers, members: "{{ secure_server_sudo_allowed_users }}" }
  loop_control:
    label: "{{ item.group }} = {{ item.members | join(',') }}"
  # gpasswd ne dit rien : le changement se lit en comparant a l etat lu.
  changed_when: (getent_group[item.group][2] | default('')) != (item.members | join(','))

- name: "Comptes - sudo pour le groupe sudousers"
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/secured-server
    content: |
      # gpenaud.secured-server : qui a sudo est dans le groupe sudousers.
      %sudousers ALL=(ALL:ALL) ALL
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
