---
- name: Restart ssh
  become: true
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart timesyncd
  become: true
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted

- name: Reload ufw
  become: true
  community.general.ufw:
    state: reloaded
  # « Reload ufw service » : le nom qu employaient les playbooks ecrits pour
  # l ancienne version du role.
  listen: ["Reload ufw", "Reload ufw service"]

- name: Reload crowdsec
  become: true
  ansible.builtin.systemd_service:
    name: crowdsec
    state: reloaded

- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Update exim4
  become: true
  ansible.builtin.command:
    cmd: update-exim4.conf
  notify: Restart exim4

- name: Restart exim4
  become: true
  ansible.builtin.service:
    name: exim4
    state: restarted

- name: Update aliases
  become: true
  ansible.builtin.command:
    cmd: newaliases
